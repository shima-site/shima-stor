<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>پنل مدیریت | شیما استور</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="header"><div class="container header-inner"><a href="index.html" class="logo"><span class="logo-mark">SH</span><span class="logo-text"><b>پنل مدیریت شیما</b><small>ADMIN</small></span></a><div class="header-actions"><a href="index.html" class="btn btn-ghost" style="min-height:42px;padding:.55rem 1rem">مشاهده فروشگاه</a><button class="btn btn-dark" style="min-height:42px;padding:.55rem 1rem" id="logoutBtn">خروج</button></div></div></header>
<div class="admin-wrap">
<div class="admin-top"><h2>مدیریت محصولات</h2><small style="color:#7d776d">عکس‌ها مستقیم در گالری فروشگاه نمایش داده می‌شوند</small></div>
<div class="stat-grid"><div class="stat"><small>تعداد محصولات</small><b id="statTotal">۰</b></div><div class="stat"><small>موجودی کل</small><b id="statStock">۰</b></div><div class="stat"><small>ارزش موجودی</small><b id="statValue">۰</b></div><div class="stat"><small>میانگین قیمت</small><b id="statAvg">۰</b></div></div>
<div class="panel"><h3 id="formTitle">افزودن محصول جدید</h3>
<div class="form-grid"><input id="pName" placeholder="نام محصول"><select id="pCat"><option>ظروف</option><option>اکسسوری</option></select><input id="pPrice" type="number" inputmode="numeric" placeholder="قیمت (تومان)"><input id="pOff" type="number" inputmode="numeric" placeholder="تخفیف درصد"><input id="pStock" type="number" inputmode="numeric" placeholder="موجودی"><textarea id="pDesc" placeholder="توضیحات محصول"></textarea></div>
<div class="up-box"><p><b>تصاویر محصول (حداکثر ۸ عکس)</b><br><small>اولین عکس کاور است. برای تغییر کاور روی عکس بزنید. بدون فیلتر ذخیره می‌شود.</small></p><div class="up-actions"><label class="btn btn-dark" style="cursor:pointer;min-height:44px">انتخاب از گالری گوشی<input type="file" id="fileInput" accept="image/*" multiple hidden></label><input type="text" id="imgUrl" placeholder="لینک عکس"><button class="btn btn-gold" id="addUrlBtn" style="min-height:44px">افزودن لینک</button><button class="btn btn-ghost" id="clearImgs" style="min-height:44px">پاک کردن</button></div><div class="prev-grid" id="previewGrid"></div></div>
<div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap"><button class="btn btn-gold" id="submitBtn">ثبت محصول</button><button class="btn btn-ghost" id="cancelEdit" style="display:none">انصراف</button></div>
</div>
<div class="panel"><h3>لیست محصولات</h3><div class="admin-list" id="productList"></div></div>
</div>
<script src="admin.js"></script>
</body>
</html>
